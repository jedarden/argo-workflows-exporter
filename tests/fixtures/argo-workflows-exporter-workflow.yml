apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: argo-workflows-exporter-build
  namespace: argo-workflows
spec:
  entrypoint: build
  arguments:
    parameters:
      - name: git-repo
        value: jedarden/argo-workflows-exporter
      - name: branch
        value: main
  volumes:
    - name: docker-config
      secret:
        secretName: docker-hub-registry
        items:
          - key: .dockerconfigjson
            path: config.json
  templates:
    - name: build
      steps:
        - - name: test
            template: test
        - - name: resolve-version
            template: resolve-version
        - - name: docker-build
            template: docker-build
            arguments:
              parameters:
                - name: version
                  value: "{{steps.resolve-version.outputs.parameters.version}}"
                - name: source-sha
                  value: "{{steps.resolve-version.outputs.parameters.source-sha}}"

    - name: test
      script:
        image: python:3.12-slim
        command: [sh]
        source: |
          set -e
          git clone --depth 1 --branch {{workflow.parameters.branch}} \
            "https://git.ardenone.com/{{workflow.parameters.git-repo}}.git" /tmp/repo
          cd /tmp/repo
          pip install --quiet --no-cache-dir -r requirements-dev.txt
          python -m pytest tests/ -q

    - name: resolve-version
      script:
        image: alpine/git
        command: [sh]
        source: |
          set -e
          cat > /tmp/git-askpass <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' git ;;
            *Password*) printf '%s\n' "$GIT_AUTH_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 /tmp/git-askpass
          export GIT_ASKPASS=/tmp/git-askpass
          export GIT_TERMINAL_PROMPT=0
          git clone --branch {{workflow.parameters.branch}} \
            "https://git.ardenone.com/{{workflow.parameters.git-repo}}.git" \
            /tmp/repo
          cd /tmp/repo

          VERSION_CHANGED=$(git diff --name-only HEAD~1 HEAD -- VERSION 2>/dev/null | grep -c '^VERSION$' || true)

          if [ "$VERSION_CHANGED" -gt 0 ] 2>/dev/null; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
            echo "VERSION changed in commit — using ${VERSION}"
          else
            CURRENT=$(cat VERSION | tr -d '[:space:]')
            if ! printf '%s\n' "$CURRENT" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "VERSION is not a semver release: ${CURRENT}" >&2
              exit 1
            fi
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Auto-bumping ${CURRENT} → ${VERSION}"
            echo "$VERSION" > VERSION
            git config user.email "github@jedarden.com"
            git config user.name "Argo Workflows CI"
            git add VERSION
            git commit -m "ci: auto-bump version to ${VERSION}"
            PUSHED=0
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                PUSHED=1
                break
              fi
              echo "Push attempt $i failed, retrying..."
              [ "$i" -eq 3 ] || sleep 3
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "Unable to push CI version bump after 3 attempts" >&2
              exit 1
            fi
          fi

          if ! printf '%s\n' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "VERSION is not a semver release: ${VERSION}" >&2
            exit 1
          fi

          echo "$VERSION" > /tmp/version
          git rev-parse HEAD > /tmp/source-sha
          grep -Eq '^[0-9a-f]{40}$' /tmp/source-sha
          echo "Building version: ${VERSION}"
      env:
        - name: GIT_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: forgejo-webhook-token
              key: token
      outputs:
        parameters:
          - name: version
            valueFrom:
              path: /tmp/version
          - name: source-sha
            valueFrom:
              path: /tmp/source-sha

    - name: docker-build
      metadata:
        labels:
          ci.ardenone.com/buildkit-client: "true"
      inputs:
        parameters:
          - name: version
          - name: source-sha
      container:
        image: moby/buildkit:v0.33.0-rootless@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
        command: [/bin/sh, -ec]
        args:
          - |
            CONTEXT="https://git.ardenone.com/{{workflow.parameters.git-repo}}.git#{{inputs.parameters.source-sha}}"
            buildctl --addr tcp://acb-buildkitd:1234 --wait build \
              --progress=plain \
              --frontend=dockerfile.v0 \
              --opt "context=${CONTEXT}" \
              --opt filename=Dockerfile \
              --opt "build-arg:VERSION={{inputs.parameters.version}}" \
              --secret id=GIT_AUTH_TOKEN,env=GIT_AUTH_TOKEN \
              --output "type=image,name=ronaldraygun/argo-workflows-exporter:{{inputs.parameters.version}},push=true"
        env:
          - name: DOCKER_CONFIG
            value: /home/user/.docker
          - name: GIT_AUTH_TOKEN
            valueFrom:
              secretKeyRef:
                name: forgejo-webhook-token
                key: token
        volumeMounts:
          - name: docker-config
            mountPath: /home/user/.docker
            readOnly: true
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 256Mi
